[package]
name = "tternary"
version = "0.2.0"
edition = "2024"

[dependencies]
burn = { version = "0.21", features = ["ndarray", "openblas-system", "train", "dataset", "sqlite-bundled"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["blocking"] }
hf-hub = { version = "0.5", features = ["tokio"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
ahash = "0.8"
serde = { version = "1", features = ["derive"] }
log = "0.4"
memmap2 = "0.9"
rayon = "1.10"
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release.build-override]
opt-level = 3

[features]
default = []
cuda = ["burn/cuda", "burn/fusion"]
